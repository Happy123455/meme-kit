<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme Review</title>
<style>
  @font-face { font-family: "MK Poppins"; src: url("../../hyperframes/fonts/Poppins-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "MK Poppins"; src: url("../../hyperframes/fonts/Poppins-ExtraBold.ttf"); font-weight: 800; }
  @font-face { font-family: "MK Archivo"; src: url("../../hyperframes/fonts/ArchivoBlack-Regular.ttf"); }
  :root {
    --bg: #f6f2ea; --panel: #ffffff; --ink: #1d2030; --muted: #6b6f80; --line: #e4ddd0; --chip: #efe8da;
    --fav: #e8364f; --good: #1f9d72; --meh: #c98a12; --never: #5b5f6e; --accent: #ffd23f; --focus: #3d8bfd;
    --check-a: #e9e3d6; --check-b: #f7f3ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14151c; --panel: #1e2029; --ink: #f1efe9; --muted: #9a9cab; --line: #2d303c; --chip: #2a2d39;
      --check-a: #262833; --check-b: #1e2029; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14px/1.4 "MK Poppins", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding: 14px 20px 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font: 400 24px/1 "MK Archivo", sans-serif; margin: 0 8px 0 0; letter-spacing: 0.01em; }
  h1 span { background: var(--accent); color: #1d2030; padding: 2px 8px; border-radius: 6px; }
  .progress { flex: 1; min-width: 160px; height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
  .muted { color: var(--muted); }
  button, select, input { font: inherit; color: inherit; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-weight: 700; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .tab { border: 0; background: var(--chip); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-weight: 700; }
  .tab.on { background: var(--ink); color: var(--bg); }
  .stat { border: 0; border-radius: 99px; padding: 5px 11px; font-weight: 800; cursor: pointer; background: var(--chip); }
  .stat.on { outline: 2px solid var(--ink); }
  select, input[type=search] { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 10px; }
  input[type=search] { min-width: 200px; }
  main { padding: 18px 20px 80px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .card.sel { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
  .card.r-favorite { border-color: var(--fav); } .card.r-never { opacity: .55; }
  .media { position: relative; aspect-ratio: 16 / 10; background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 22px 22px; display: grid; place-items: center; cursor: pointer; }
  .media video, .media img, .media .sheet { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .media .sheet { width: 100%; height: 100%; background-repeat: no-repeat; background-size: 600% auto; }
  .media .snd { font-size: 54px; filter: grayscale(.1); }
  .media .play { position: absolute; right: 8px; bottom: 8px; background: rgba(20,22,30,.82); color: #fff; border: 0; border-radius: 99px; padding: 6px 12px; font-weight: 800; cursor: pointer; }
  .media .badge { position: absolute; left: 8px; top: 8px; background: rgba(20,22,30,.82); color: #fff; border-radius: 99px; padding: 3px 9px; font-size: 12px; font-weight: 800; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .id { font-weight: 800; font-size: 15px; word-break: break-word; }
  .mood { display: inline-block; background: var(--chip); border-radius: 99px; padding: 1px 9px; font-size: 12px; font-weight: 800; margin-right: 6px; }
  .what { color: var(--muted); font-size: 13px; min-height: 2.8em; }
  .rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: auto; }
  .rate button { border: 2px solid var(--line); background: transparent; border-radius: 10px; padding: 6px 0; cursor: pointer; font-size: 13px; font-weight: 800; }
  .rate button.on[data-r=favorite] { background: var(--fav); border-color: var(--fav); color: #fff; }
  .rate button.on[data-r=good] { background: var(--good); border-color: var(--good); color: #fff; }
  .rate button.on[data-r=meh] { background: var(--meh); border-color: var(--meh); color: #fff; }
  .rate button.on[data-r=never] { background: var(--never); border-color: var(--never); color: #fff; }
  .note { width: 100%; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 5px 8px; font-size: 13px; }
  .edit { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 8px; display: flex; flex-direction: column; gap: 7px; }
  .edit .lbl { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .trim { position: relative; height: 46px; border-radius: 8px; background: var(--chip); cursor: crosshair; touch-action: none; user-select: none; overflow: hidden; }
  .trim canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .trim .sel { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--focus) 28%, transparent); border-left: 3px solid var(--focus); border-right: 3px solid var(--focus); }
  .trim .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fav); display: none; }
  .trim.on .ph { display: block; }
  .mini { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 2px 8px; font-size: 12px; font-weight: 800; cursor: pointer; }
  .mini.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .seg3 button { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 4px 2px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
  .seg3 button.on { background: var(--focus); border-color: var(--focus); color: #fff; }
  .pair { display: grid; grid-template-columns: 1fr 62px; gap: 5px; }
  .edit input[type=text], .edit input[type=number] { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 7px; font-size: 12.5px; min-width: 0; }
  .sugg { border: 1px dashed var(--good); color: var(--good); background: transparent; border-radius: 7px; padding: 4px 8px; font-size: 12px; font-weight: 800; cursor: pointer; text-align: left; }
  .sugg:hover { background: color-mix(in srgb, var(--good) 12%, transparent); }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; }
  .flags span { font-size: 11px; font-weight: 800; background: var(--chip); border-radius: 99px; padding: 1px 7px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-weight: 800; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .keys { font-size: 12px; }
  kbd { background: var(--chip); border-radius: 5px; padding: 1px 6px; font: 700 12px "MK Poppins", sans-serif; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--muted); }
  @media (max-width: 600px) { header { position: static; padding: 12px 16px 8px; } .keys { display: none; } main { padding: 14px 16px 80px; grid-template-columns: 1fr; } input[type=search] { min-width: 0; flex: 1; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Meme <span>Review</span></h1>
    <div class="progress" title="reviewed"><i id="prog"></i></div>
    <span id="progtxt" class="muted"></span>
    <button class="btn" id="review">▶ Review unrated</button>
    <button class="btn primary" id="save" title="Write ratings into catalog.json / CATALOG.md so Claude uses them">Save to catalog</button>
    <a class="btn" href="camfx.html" style="text-decoration:none;color:inherit">🎥 Camera FX →</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="row" style="margin-top:10px">
    <div id="stats" class="row"></div>
    <select id="mood"><option value="">all moods</option></select>
    <input type="search" id="q" placeholder="search name or meaning…">
    <span class="keys muted"><kbd>1</kbd> ❤️ <kbd>2</kbd> 👍 <kbd>3</kbd> 😐 <kbd>4</kbd> 🚫 <kbd>0</kbd> clear · <kbd>space</kbd> play · <kbd>←</kbd><kbd>→</kbd> move · <kbd>n</kbd> note · drag the bar under a clip to trim</span>
  </div>
</header>
<main id="grid"></main>
<datalist id="dl-sounds"></datalist>
<div class="toast" id="toast"></div>
<script>
const ROOT = "../../";
const R = { favorite: "❤️ Fav", good: "👍 Good", meh: "😐 Meh", never: "🚫 Never" };
const TYPES = [["all", "All"], ["greenscreen", "Green-screen clips"], ["gif", "Reaction GIFs"], ["sound", "Sounds"], ["photo", "Photo memes"]];
const SCREEN = [["", "AI decides"], ["full", "Always full"], ["window", "Never full"]];
// every per-item setting lives in meta/ratings.json under "type:id": rating, note, trim [a, b], mute, pair {sound, at, note}, screen
let items = [], byKey = {}, ratings = {}, autoPairs = {}, sounds = {}, server = true, state = { type: "all", mood: "", q: "", rating: "", review: false }, sel = -1, shown = [];
const $ = (s) => document.querySelector(s);
const key = (i) => `${i.type}:${i.id}`;
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 1400); };
const cardOf = (k) => document.querySelector(`.card[data-key="${CSS.escape(k)}"]`);

async function init() {
  items = (await (await fetch(ROOT + "catalog.json", { cache: "no-store" })).json()).items.filter((i) => i.type !== "camfx");
  items.forEach((i) => { byKey[key(i)] = i; if (i.type === "sound") sounds[i.id] = i; });
  try { autoPairs = await (await fetch(ROOT + "meta/pairs_auto.json", { cache: "no-store" })).json(); } catch { autoPairs = {}; }
  try { ratings = await (await fetch("/api/ratings", { cache: "no-store" })).json(); }
  catch { server = false; try { ratings = JSON.parse(localStorage.getItem("memeRatings") || "{}"); } catch { ratings = {}; }
    $("#save").textContent = "Export ratings"; toast("Offline mode — start tools/dashboard.py to save into the kit"); }
  $("#dl-sounds").innerHTML = Object.values(sounds).map((s) => `<option value="${esc(s.id)}">${esc((s.what || "").slice(0, 60))}</option>`).join("");
  const moods = [...new Set(items.map((i) => i.mood))].sort();
  $("#mood").innerHTML += moods.map((m) => `<option>${m}</option>`).join("");
  render();
}

function counts() {
  const c = { favorite: 0, good: 0, meh: 0, never: 0, unrated: 0, edited: 0, noted: 0 };
  for (const i of items) { const r = ratings[key(i)] || {}; c[r.rating || "unrated"]++; if (r.trim || r.mute || r.pair || r.screen) c.edited++; if (r.note) c.noted++; }
  return c;
}

function header() {
  const c = counts(), done = items.length - c.unrated;
  $("#prog").style.width = (100 * done / items.length) + "%";
  $("#progtxt").textContent = `${done} / ${items.length} reviewed`;
  $("#tabs").innerHTML = TYPES.map(([t, n]) => `<button class="tab ${state.type === t ? "on" : ""}" data-t="${t}">${n} · ${t === "all" ? items.length : items.filter((i) => i.type === t).length}</button>`).join("");
  $("#stats").innerHTML = [["", `All`], ["unrated", `⬜ ${c.unrated}`], ["favorite", `❤️ ${c.favorite}`], ["good", `👍 ${c.good}`], ["meh", `😐 ${c.meh}`], ["never", `🚫 ${c.never}`],
    ["edited", `✂️ edited ${c.edited}`], ["noted", `📝 notes ${c.noted}`]]
    .map(([r, t]) => `<button class="stat ${state.rating === r ? "on" : ""}" data-r="${r}">${t}</button>`).join("");
}

// ---------- media + editor ----------
const span = (i) => i.type === "greenscreen" ? i.dur : (i.dur || 1);           // full length of the source
const defTrim = (i) => i.type === "greenscreen" ? [i.start || 0, i.dur] : [0, i.dur || 1];
const trimOf = (i) => (ratings[key(i)] || {}).trim || defTrim(i);
const fmt = (x) => (+x).toFixed(1);

function media(i) {
  if (i.type === "greenscreen") return `<video data-src="${ROOT + i.video}" data-t="${i.start || 0}" muted playsinline preload="none"></video>
    ${i.audio ? `<audio data-src="${ROOT + i.audio}" preload="none"></audio>` : ""}<span class="badge">${i.usable}s${i.alpha ? " · see-through" : ""}</span><button class="play">▶ play</button>`;
  if (i.type === "gif") return (i.mp4 ? `<video data-src="${ROOT + i.mp4}" muted loop playsinline preload="none"></video>` : `<div class="sheet" style="background-image:url(${ROOT + i.sheet})"></div>`)
    + (i.face ? `<span class="badge">face ✓</span>` : "") + `<button class="play">▶ play</button>`;
  if (i.type === "sound") return `<div class="snd">${i.kind === "meme" ? "🔊" : "🎵"}</div><audio data-src="${ROOT + i.file}" preload="none"></audio><span class="badge">${i.dur ?? "?"}s · ${i.kind}</span><button class="play">▶ play</button>`;
  return `<img data-src="${ROOT + i.file}" alt="${i.id}">` + (i.layout ? `<span class="badge">${i.layout.length} label slots</span>` : "");
}

function flags(r) {
  const f = [];
  if (r.trim) f.push(`✂️ ${fmt(r.trim[0])}–${fmt(r.trim[1])}s`);
  if (r.mute) f.push("🔇 clip muted");
  if (r.pair) f.push(`🔗 ${esc(r.pair.sound)}`);
  if (r.screen) f.push(r.screen === "full" ? "⛶ always full" : "▣ never full");
  return f.length ? `<div class="flags">${f.map((x) => `<span>${x}</span>`).join("")}</div>` : "";
}

function editor(i) {
  if (i.type !== "greenscreen" && i.type !== "sound") return "";
  const r = ratings[key(i)] || {}, [a, b] = trimOf(i), L = span(i);
  let h = `<div class="edit">
    <div class="lbl"><span>✂️ use only <b class="tt">${fmt(a)}–${fmt(b)}s</b> (${fmt(b - a)}s)</span><button class="mini reset" title="use the whole clip">full</button></div>
    <div class="trim" data-len="${L}"><canvas></canvas><div class="sel" style="left:${100 * a / L}%;width:${100 * (b - a) / L}%"></div><i class="ph"></i></div>`;
  if (i.type === "greenscreen") {
    h += `<div class="lbl"><span>Screen</span>${i.audio ? `<button class="mini mute ${r.mute ? "on" : ""}" title="use the clip without its own audio">🔇 mute clip audio</button>` : ""}</div>
      <div class="seg3">${SCREEN.map(([v, t]) => `<button data-screen="${v}" class="${(r.screen || "") === v ? "on" : ""}">${t}</button>`).join("")}</div>
      <div class="lbl"><span>🔗 pair with a sound</span>${r.pair ? `<button class="mini unpair">remove</button>` : ""}</div>
      <div class="pair"><input type="text" class="psound" list="dl-sounds" placeholder="sound name…" value="${esc(r.pair?.sound)}">
        <input type="number" class="pat" step="0.1" min="0" placeholder="at s" title="seconds into the clip where the sound starts" value="${r.pair?.at ?? ""}"></div>
      <input type="text" class="pnote" placeholder="why they go together (AI reads this)" value="${esc(r.pair?.note)}">`;
    const sug = (autoPairs[key(i)] || []).filter((s) => !r.pair || r.pair.sound !== s.sound);
    h += sug.map((s) => `<button class="sugg" data-s="${esc(s.sound)}" data-at="${s.at}">🔁 same audio as “${esc(s.sound)}” (${Math.round(s.score * 100)}% match) — pair it</button>`).join("");
  }
  return h + `</div>`;
}

function card(i, n) {
  const r = ratings[key(i)] || {};
  return `<article class="card ${r.rating ? "r-" + r.rating : ""}" data-n="${n}" data-key="${esc(key(i))}">
    <div class="media">${media(i)}</div>
    <div class="body">
      <div class="id">${i.id}</div>
      <div><span class="mood">${i.mood}</span><span class="muted" style="font-size:12px">${i.type}</span></div>
      <div class="what">${esc(i.what)}</div>
      ${flags(r)}
      <div class="rate">${Object.entries(R).map(([k, t]) => `<button data-r="${k}" class="${r.rating === k ? "on" : ""}">${t}</button>`).join("")}</div>
      <input class="note" placeholder="note for this meme only (AI reads it)" value="${esc(r.note)}">
      ${editor(i)}
    </div></article>`;
}

function filtered() {
  const q = state.q.toLowerCase();
  return items.filter((i) => { const r = ratings[key(i)] || {};
    return (state.type === "all" || i.type === state.type) && (!state.mood || i.mood === state.mood)
      && (!q || (i.id + " " + (i.what || "") + " " + (r.note || "")).toLowerCase().includes(q))
      && (!state.rating || (state.rating === "unrated" ? !r.rating : state.rating === "edited" ? (r.trim || r.mute || r.pair || r.screen) : state.rating === "noted" ? !!r.note : r.rating === state.rating)); });
}

// waveform of the clip's / sound's audio, drawn once the card is on screen
const actx = () => (window._ac ||= new (window.AudioContext || window.webkitAudioContext)());
async function wave(c) {
  const i = byKey[c.dataset.key], cv = c.querySelector(".trim canvas"); if (!cv || cv.dataset.done) return; cv.dataset.done = 1;
  const src = i.type === "sound" ? i.file : i.audio; const g = cv.getContext("2d"); const W = cv.width = cv.clientWidth * 2, H = cv.height = cv.clientHeight * 2;
  g.fillStyle = getComputedStyle(document.body).getPropertyValue("--muted");
  if (!src) { g.fillRect(0, H / 2 - 1, W, 2); return; }
  try {
    const buf = await actx().decodeAudioData(await (await fetch(ROOT + src)).arrayBuffer());
    const d = buf.getChannelData(0), L = span(i), per = Math.max(1, Math.floor(buf.sampleRate * L / W));
    for (let x = 0; x < W; x++) { let m = 0; for (let k = x * per; k < (x + 1) * per && k < d.length; k += 8) m = Math.max(m, Math.abs(d[k])); const h = Math.max(2, m * H * .92); g.fillRect(x, (H - h) / 2, 1, h); }
  } catch { g.fillRect(0, H / 2 - 1, W, 2); }
}

const io = new IntersectionObserver((es) => es.forEach((e) => { if (!e.isIntersecting) return;
  e.target.querySelectorAll("[data-src]").forEach((m) => { m.src = m.dataset.src; m.removeAttribute("data-src");
    if (m.tagName === "VIDEO") { m.preload = "metadata"; m.addEventListener("loadedmetadata", () => { m.currentTime = (+m.dataset.t || 0) + Math.min(1, (m.duration || 2) / 3); }, { once: true }); } });
  wave(e.target); io.unobserve(e.target); }), { rootMargin: "400px" });

function render() {
  stopAll(); header(); shown = filtered();
  $("#grid").innerHTML = shown.length ? shown.map(card).join("") : `<div class="empty">Nothing here — change the filters.</div>`;
  document.querySelectorAll(".card").forEach((c) => io.observe(c));
  if (sel >= shown.length) sel = shown.length - 1;
  if (state.review && shown.length) select(0); else if (sel >= 0) select(sel, false);
}

function select(n, scroll = true) {
  document.querySelectorAll(".card.sel").forEach((c) => c.classList.remove("sel"));
  sel = n; const c = document.querySelector(`.card[data-n="${n}"]`); if (!c) return;
  c.classList.add("sel"); if (scroll) c.scrollIntoView({ block: "center", behavior: "smooth" });
}

// ---------- playback: plays exactly what was chosen (trim, mute, paired sound) ----------
let playing = null;
function stopAll() {
  document.querySelectorAll("video, audio").forEach((m) => m.pause());
  if (playing) { cancelAnimationFrame(playing.raf); playing.extra?.pause(); playing.c.querySelector(".trim")?.classList.remove("on"); }
  playing = null;
}
function play(c) {
  if (playing && playing.c === c) { stopAll(); return; }
  stopAll();
  const i = byKey[c.dataset.key], r = ratings[key(i)] || {};
  const v = c.querySelector("video"), a = c.querySelector("audio");
  [v, a].forEach((m) => { if (m && m.dataset.src) { m.src = m.dataset.src; m.removeAttribute("data-src"); } });
  const ed = i.type === "greenscreen" || i.type === "sound";
  const [t0, t1] = ed ? trimOf(i) : [v ? +v.dataset.t || 0 : 0, 1e9];
  if (v) { v.currentTime = t0; v.play().catch(() => {}); }
  if (a && !(i.type === "greenscreen" && r.mute)) { a.currentTime = t0; a.volume = 1; a.play().catch(() => {}); }
  let extra = null;
  if (i.type === "greenscreen" && r.pair && sounds[r.pair.sound]) {    // preview the paired sound where it is meant to start
    const ps = sounds[r.pair.sound], pr = ratings[`sound:${ps.id}`] || {}, pt = pr.trim || [0, ps.dur];
    extra = new Audio(ROOT + ps.file); extra.currentTime = pt[0];
    const wait = Math.max(0, (+r.pair.at || 0) - t0) * 1000;
    setTimeout(() => { if (playing && playing.extra === extra) extra.play().catch(() => {}); }, wait);
  }
  const tr = c.querySelector(".trim"), ph = tr?.querySelector(".ph"), L = ed ? span(i) : 0;
  tr?.classList.add("on");
  playing = { c, extra, raf: 0 };
  const clock = v || a;
  const tick = () => {
    if (!playing || playing.c !== c) return;
    const t = clock ? clock.currentTime : t0;
    if (ph && L) ph.style.left = (100 * t / L) + "%";
    if (ed && t >= t1 - .02) { stopAll(); return; }
    if (clock && clock.ended) { stopAll(); return; }
    playing.raf = requestAnimationFrame(tick);
  };
  playing.raf = requestAnimationFrame(tick);
}

// ---------- saving (always by the meme's own key — never by its position in the list) ----------
async function save(k, patch) {
  const cur = { ...(ratings[k] || {}) };
  for (const [f, v] of Object.entries(patch)) { if (v === null || v === "" || v === false || (Array.isArray(v) && !v.length)) delete cur[f]; else cur[f] = v; }
  if (Object.keys(cur).length) ratings[k] = cur; else delete ratings[k];
  if (server) { try { await fetch("/api/rate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: k, ...patch }) }); } catch { toast("Save failed — is the dashboard server running?"); } }
  else { try { localStorage.setItem("memeRatings", JSON.stringify(ratings)); } catch {} }
  header();
  const c = cardOf(k);
  if (c) { const f = c.querySelector(".flags"), nf = flags(cur); if (f) f.outerHTML = nf || ""; else if (nf) c.querySelector(".rate").insertAdjacentHTML("beforebegin", nf); }
}

async function rate(k, r) {
  await save(k, { rating: r });
  const c = cardOf(k);
  if (c) { c.classList.remove("r-favorite", "r-good", "r-meh", "r-never"); if (r) c.classList.add("r-" + r); c.querySelectorAll(".rate button").forEach((b) => b.classList.toggle("on", b.dataset.r === r)); }
  toast(r ? R[r] : "cleared");
  if (state.review) { stopAll(); setTimeout(() => { render(); if (shown.length) play(document.querySelector('.card[data-n="0"]')); else { state.review = false; toast("All reviewed 🎉"); } }, 250); }
}

function redrawEditor(c) {
  const i = byKey[c.dataset.key], ed = c.querySelector(".edit"); if (!ed) return;
  ed.outerHTML = editor(i); delete c.querySelector(".trim canvas")?.dataset.done; wave(c);
}

// trim: drag either edge, or drag across the bar for a new selection; double-click = whole clip
let drag = null;
document.addEventListener("pointerdown", (e) => {
  const tr = e.target.closest(".trim"); if (!tr) return;
  const c = tr.closest(".card"), i = byKey[c.dataset.key], L = +tr.dataset.len, box = tr.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (e.clientX - box.left) / box.width)) * L, [a, b] = trimOf(i), px = L / box.width;
  const mode = Math.abs(x - a) < 10 * px ? "a" : Math.abs(x - b) < 10 * px ? "b" : "new";
  drag = { tr, c, i, L, box, mode, a: mode === "new" ? x : a, b: mode === "new" ? x : b, x0: x };
  tr.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const x = Math.max(0, Math.min(1, (e.clientX - drag.box.left) / drag.box.width)) * drag.L;
  if (drag.mode === "a") drag.a = Math.min(x, drag.b - .1); else if (drag.mode === "b") drag.b = Math.max(x, drag.a + .1); else { drag.a = Math.min(drag.x0, x); drag.b = Math.max(drag.x0, x); }
  const s = drag.tr.querySelector(".sel"); s.style.left = (100 * drag.a / drag.L) + "%"; s.style.width = (100 * (drag.b - drag.a) / drag.L) + "%";
  drag.c.querySelector(".tt").textContent = `${fmt(drag.a)}–${fmt(drag.b)}s`;
});
document.addEventListener("pointerup", async () => {
  if (!drag) return; const d = drag; drag = null;
  if (d.b - d.a < .15) { redrawEditor(d.c); return; }
  const def = defTrim(d.i), same = Math.abs(d.a - def[0]) < .05 && Math.abs(d.b - def[1]) < .05;
  await save(key(d.i), { trim: same ? null : [+d.a.toFixed(2), +d.b.toFixed(2)] });
  d.c.querySelector(".lbl b").parentElement.innerHTML = `✂️ use only <b class="tt">${fmt(d.a)}–${fmt(d.b)}s</b> (${fmt(d.b - d.a)}s)`;
  toast(same ? "whole clip" : `using ${fmt(d.a)}–${fmt(d.b)}s`); play(d.c);
});
document.addEventListener("dblclick", async (e) => { const tr = e.target.closest(".trim"); if (!tr) return; const c = tr.closest(".card"); await save(c.dataset.key, { trim: null }); redrawEditor(c); toast("whole clip"); });

document.addEventListener("click", async (e) => {
  const t = e.target, c = t.closest(".card");
  if (t.matches(".tab")) { state.type = t.dataset.t; sel = -1; render(); return; }
  if (t.matches(".stat")) { state.rating = t.dataset.r; sel = -1; render(); return; }
  if (!c) return; const k = c.dataset.key, n = +c.dataset.n, r = ratings[k] || {};
  if (t.matches(".rate button")) { select(n, false); rate(k, r.rating === t.dataset.r ? null : t.dataset.r); return; }
  if (t.matches(".reset")) { await save(k, { trim: null }); redrawEditor(c); toast("whole clip"); return; }
  if (t.matches(".mute")) { await save(k, { mute: !r.mute }); t.classList.toggle("on", !r.mute); toast(!r.mute ? "🔇 clip audio muted" : "clip audio on"); return; }
  if (t.dataset.screen !== undefined) { await save(k, { screen: t.dataset.screen || null }); c.querySelectorAll(".seg3 button").forEach((b) => b.classList.toggle("on", b === t)); toast(SCREEN.find((s) => s[0] === t.dataset.screen)[1]); return; }
  if (t.matches(".unpair")) { await save(k, { pair: null }); redrawEditor(c); toast("pair removed"); return; }
  if (t.matches(".sugg")) { await save(k, { pair: { sound: t.dataset.s, at: +t.dataset.at, note: "same audio as the clip (auto-detected)" }, mute: true }); redrawEditor(c);
    c.querySelector(".mute")?.classList.add("on"); toast(`🔗 paired with ${t.dataset.s} · clip audio muted`); return; }
  if (t.closest(".edit")) return;
  if (t.closest(".media")) { select(n, false); play(c); return; }
  if (!t.matches(".note")) select(n, false);
});
document.addEventListener("change", async (e) => {
  const t = e.target, c = t.closest(".card"); if (!c) return; const k = c.dataset.key, r = ratings[k] || {};
  if (t.matches(".note")) { await save(k, { note: t.value.trim() }); toast("📝 note saved for " + byKey[k].id); return; }
  if (t.matches(".psound, .pat, .pnote")) {
    const s = c.querySelector(".psound").value.trim();
    if (s && !sounds[s]) { toast(`no sound called “${s}”`); return; }
    await save(k, { pair: s ? { sound: s, at: +c.querySelector(".pat").value || 0, note: c.querySelector(".pnote").value.trim() } : null });
    toast(s ? `🔗 ${byKey[k].id} + ${s}` : "pair removed");
  }
});
$("#mood").onchange = (e) => { state.mood = e.target.value; sel = -1; render(); };
$("#q").oninput = (e) => { state.q = e.target.value; sel = -1; render(); };
$("#review").onclick = () => { state.review = true; state.rating = "unrated"; render(); if (shown.length) play(document.querySelector('.card[data-n="0"]')); toast("Review mode: 1-4 to rate, auto-advances"); };
$("#save").onclick = async () => {
  if (!server) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(ratings, null, 1)], { type: "application/json" })); a.download = "ratings.json"; a.click(); toast("Put it in meme-kit/meta/ratings.json"); return; }
  const r = await (await fetch("/api/rebuild", { method: "POST" })).json(); toast(r.ok ? "Catalog updated ✔" : "Rebuild failed");
};
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select")) { if (e.key === "Escape" || e.key === "Enter") e.target.blur(); return; }
  const map = { "1": "favorite", "2": "good", "3": "meh", "4": "never", "0": null };
  const c = document.querySelector(`.card[data-n="${sel}"]`);
  if (e.key in map && c) { rate(c.dataset.key, map[e.key]); e.preventDefault(); }
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") { select(Math.min(shown.length - 1, sel + 1)); e.preventDefault(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { select(Math.max(0, sel - 1)); e.preventDefault(); }
  else if (e.key === " " && c) { play(c); e.preventDefault(); }
  else if (e.key === "n" && c) { c.querySelector(".note").focus(); e.preventDefault(); }
  else if (e.key === "Escape") { state.review = false; stopAll(); }
});
init();
</script>
</body>
